name: CI — verify and publish image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - run: python -m pylint app --score=no
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
  image-build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build image on its native architecture
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          docker build --tag "devops-ci-app:${GITHUB_SHA}" .
      - name: Smoke-test container
        run: |
          set -euo pipefail
          cleanup() {
            docker logs smoke || true
            docker rm -f smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name smoke -p 127.0.0.1:5000:5000 "devops-ci-app:${GITHUB_SHA}"
          ready=0
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:5000/health --output health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::/health did not respond after 15 attempts"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("health.json").read_text(encoding="utf-8"))
          assert payload == {"status": "ok"}, f"unexpected /health payload: {payload}"
          PY
          docker exec smoke id
      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push tested platform image
        if: github.event_name == 'push'
        run: |
          IMAGE_NAME="${IMAGE_NAME,,}"
          docker tag "devops-ci-app:${GITHUB_SHA}" "${IMAGE_NAME}:${GITHUB_SHA}-${{ matrix.arch }}"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}-${{ matrix.arch }}"
  image:
    needs: image-build
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Both native architecture builds and smoke tests passed.'
  publish:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish multi-platform image index
        run: |
          set -euo pipefail
          IMAGE_NAME="${IMAGE_NAME,,}"
          TAGS=(-t "${IMAGE_NAME}:${GITHUB_SHA}")
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS+=(-t "${IMAGE_NAME}:latest")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS+=(-t "${IMAGE_NAME}:${GITHUB_REF_NAME#v}")
          fi
          docker buildx imagetools create "${TAGS[@]}" \
            "${IMAGE_NAME}:${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${GITHUB_SHA}"
  deploy:
    needs: [image, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, devops-vm]
    permissions:
      contents: read
    concurrency:
      group: deploy-devops-vm
      cancel-in-progress: false
    env:
      VM_HOST: 192.168.56.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy with Ansible
        working-directory: ansible
        run: ansible-playbook site.yml -e "app_tag=${GITHUB_SHA}"
      - name: Check through Nginx
        run: curl --fail --show-error --silent --retry 8 --retry-delay 2 --retry-connrefused "http://${VM_HOST}/health"
